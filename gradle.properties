org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Which Minecraft version to build for. Each one has a file in versions/ with its dependency versions.
# Build another with e.g. `./gradlew build -Pmc=26.2`, or all of them with `./gradlew buildAllVersions`.
mc=26.3
supported_versions=26.3,26.2,26.1.2,1.21.11,1.21.10

# Fabric properties — see https://fabricmc.net/develop
loader_version=0.19.5
loom_version=1.18.2
junit_version=6.1.3

# Mod properties
mod_version=1.6.0
maven_group=dev.wellopti
archives_base_name=wellopti
