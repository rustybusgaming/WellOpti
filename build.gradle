plugins {
	// 26.1+ ships unobfuscated and uses the plain plugin; 1.21.x is obfuscated and needs the remapping one.
	// Which one applies is decided per Minecraft version below.
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
	id 'fabric-loom' version "${loom_version}" apply false
	id 'maven-publish'
}

// Load the per-Minecraft-version settings (versions/<mc>.properties) into the project's properties.
def mcTarget = project.property("mc").toString()
def versionFile = file("versions/${mcTarget}.properties")
if (!versionFile.exists()) {
	throw new GradleException("No versions/${mcTarget}.properties. Supported: ${project.supported_versions}")
}
def versionProps = new Properties()
versionFile.withInputStream { versionProps.load(it) }
// A -P on the command line still wins, e.g. -Pfabric_api_version=... to try a newer Fabric API.
versionProps.each { key, value ->
	if (!project.hasProperty(key as String)) {
		project.ext.set(key as String, value)
	}
}

def obfuscated = project.findProperty("obfuscated")?.toString()?.toBoolean() ?: false
apply plugin: obfuscated ? 'fabric-loom' : 'net.fabricmc.fabric-loom'
def javaVersion = (project.findProperty("java_version") ?: "25").toString().toInteger()

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

// Code that differs between Minecraft versions lives in src/compat/<name>; everything else is shared.
sourceSets {
	main {
		java.srcDir "src/compat/${project.compat}/java"
	}
}

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/releases/"
	}
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	if (obfuscated) {
		// Mojang's official names, so the same source reads the same on every version.
		mappings loom.officialMojangMappings()
		modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
		modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
		modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
		if (project.hasProperty("withSodium")) {
			modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
		}
	} else {
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

		// Optional: only used to add a config button in Mod Menu.
		compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

		// Opt-in: `./gradlew runClient -PwithSodium` launches the dev client with Sodium to check compatibility.
		if (project.hasProperty("withSodium")) {
			localRuntime "maven.modrinth:sodium:${project.sodium_version}"
		}
	}

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	inputs.property "minecraft_dependency", project.minecraft_dependency
	inputs.property "java_version", javaVersion
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
			"minecraft_dependency": project.minecraft_dependency,
			"loader_version": project.loader_version,
			"java_version": javaVersion
	}
	filesMatching("wellopti.mixins.json") {
		expand "java_version": javaVersion
	}
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}
	withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersion
	it.options.encoding = "UTF-8"
}

jar {
	inputs.property "archivesName", project.base.archivesName
	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}" }
	}
}

// Builds a jar for every supported Minecraft version into build/libs, one Gradle run each.
tasks.register("buildAllVersions") {
	group = "build"
	description = "Builds WellOpti for every Minecraft version in supported_versions."
	doLast {
		project.supported_versions.split(",").each { target ->
			def result = project.providers.exec {
				workingDir = project.rootDir
				commandLine "${project.rootDir}/gradlew", "build", "-Pmc=${target.trim()}", "--console=plain"
				ignoreExitValue = true
			}
			if (result.result.get().exitValue != 0) {
				throw new GradleException("Build for Minecraft ${target} failed:\n" + result.standardOutput.asText.get() + result.standardError.asText.get())
			}
			println "Built Minecraft ${target}"
		}
	}
}
