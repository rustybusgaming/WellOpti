name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with supported_versions in gradle.properties.
        mc: ["26.3", "26.2", "26.1.2", "1.21.11", "1.21.10"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -Pmc=${{ matrix.mc }}

      - uses: actions/upload-artifact@v4
        with:
          name: wellopti-mc${{ matrix.mc }}
          path: build/libs/*.jar
          if-no-files-found: error
