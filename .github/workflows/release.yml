name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Minecraft ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with supported_versions in gradle.properties.
        mc: ["26.3", "26.2", "26.1.2"]
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -Pmc=${{ matrix.mc }}

      - name: Read version info
        id: info
        run: |
          {
            echo "game_versions<<EOF"
            grep '^game_versions=' versions/${{ matrix.mc }}.properties | cut -d= -f2 | tr ',' '\n'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          generate_release_notes: true

      # Optional: set the MODRINTH_TOKEN secret and MODRINTH_PROJECT_ID variable in the repo settings to enable.
      - name: Publish to Modrinth
        if: env.MODRINTH_TOKEN != '' && env.MODRINTH_PROJECT_ID != ''
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ env.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ env.MODRINTH_TOKEN }}
          files: |
            build/libs/!(*-sources).jar
          name: WellOpti ${{ github.ref_name }} for Minecraft ${{ matrix.mc }}
          version: ${{ github.ref_name }}+${{ matrix.mc }}
          version-type: release
          loaders: fabric
          game-versions: ${{ steps.info.outputs.game_versions }}
          dependencies: |
            fabric-api(required)
            modmenu(optional)
            sodium(recommended)
